name: screen

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1,15 * *"   # 毎月1日と15日の9時(JST)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests xlrd openpyxl lxml
      - run: python screener.py
      - run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "update results" || echo "no changes"
          git push
